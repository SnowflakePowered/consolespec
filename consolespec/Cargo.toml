[package]
name = "consolespec"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.94"
build = "build.rs"
description = "Game console specification database"
homepage = "https://github.com/SnowflakePowered/consolespec"
repository = "https://github.com/SnowflakePowered/consolespec"
# The definition sources live at the repository root, not in the crate: the
# mtree tree alone is 78 MiB of text. What ships is the archive built from it.
include = ["src/**/*.rs", "build.rs", "definitions.csa", "README.md"]

[features]
default = []
partition-specs = []
partition-spec-digests = ["partition-specs"]

[dependencies]
phf = "0.14"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
consolespec-build = { path = "../consolespec-build", version = "0.0.1" }
phf_codegen = "0.14"
serde = { version = "1.0", features = ["derive"] }
string-interner = { version = "0.20", default-features = false, features = ["std", "backends"] }
toml = "0.9"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
