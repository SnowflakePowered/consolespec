[input]
id = "WII_REMOTE_CONTROLLER"
type = "controller"

[meta]
name = "Wii Remote"
model-number = ["RVL-003", "RVL-036"]

[[input.button]]
label = "A"
element = "a"

[[input.button]]
label = "B"
element = "b"

[[input.button]]
label = "1"
element = "0"

[[input.button]]
label = "2"
element = "1"

[[input.button]]
label = "+"
element = "start"

[[input.button]]
label = "-"
element = "select"

[[input.button]]
label = "Home"
element = "guide"

[[input.directional]]
label = "D-Pad"
directions = 4

[[input.analog]]
axes = 3
class = "gyroscope"

[[input.analog]]
axes = 3
class = "accelerometer"

[[input.pointer]]
label = "IR"
dimensions = 2
