[machine]
name = "WiiU"
id = "NINTENDO_WIIU"

[meta]
short-name = "WiiU"
licensor = "Nintendo"
manufacturer = "Nintendo"
type = "console"
model-number = ["WUP-001", "WUP-101"]

[meta.na]
release-date = "2012-11-18"

[input]
groups = ["gamepad", "controller", "usb"]

[input.gamepad]
inputs = ["WIIU_DRC_CONTROLLER"]
ports = 1

[input.usb]
accessories = true

[accessories]
class = [
    "disney_infinity",
    "skylander",
    "keyboard",
    "camera",
    "microphone",
    "storage"
]

[input.controller]
inputs = ["GAMECUBE_CONTROLLER",  "WIIU_PRO_CONTROLLER", "WII_REMOTE_CONTROLLER", "WII_REMOTE_NUNCHUCK_CONTROLLER"]
ports = 8

[storage]
devices = ["slc", "slccmpt", "mlc", "sd"]

[storage.slc]
name = "System NAND"

[storage.slccmpt]
name = "vWii NAND"

[[storage.slccmpt.partition]]
id = "title"
name = "title"
spec = [
    "NINTENDO_WIIU/slccmpt/title/1.0.0E.mtree",
    "NINTENDO_WIIU/slccmpt/title/1.0.0J.mtree",
