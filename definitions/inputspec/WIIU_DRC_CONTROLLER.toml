[input]
id = "WIIU_DRC_CONTROLLER"
type = "controller"

[meta]
name = "Wii U GamePad"
model-number = ["WUP-010"]

[[input.button]]
label = "A"
element = "a"

[[input.button]]
label = "B"
element = "b"

[[input.button]]
label = "X"
element = "x"

[[input.button]]
label = "Y"
element = "y"

[[input.button]]
label = "+"
element = "start"

[[input.button]]
label = "-"
element = "select"

[[input.button]]
label = "Home"
element = "guide"

[[input.button]]
label = "L1"
element = "l"

[[input.button]]
label = "R1"
element = "r"

[[input.button]]
label = "L3"
element = "clickl"

[[input.button]]
label = "R3"
element = "clickr"

[[input.directional]]
label = "D-Pad"
directions = 4

[[input.analog]]
axes = 2
alignment = "left"

[[input.analog]]
axes = 2
alignment = "right"

[[input.analog]]
axes = 3
class = "gyroscope"

[[input.analog]]
axes = 3
class = "accelerometer"

[[input.trigger]]
label = "L2"
alignment = "left"
digital = true

[[input.trigger]]
label = "R2"
alignment = "right"
digital = true

[[input.touchscreen]]
width = 854
height = 480

[[input.microphone]]
label = "Microphone"

[[input.camera]]
label = "Front Camera"
