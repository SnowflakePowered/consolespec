[input]
id = "PSX_CONTROLLER"
type = "controller"

[meta]
name = "PlayStation Controller"
model-number = ["SCPH-1010", "SCPH-1080"]

[meta.jp]
name = "コントローラー"
name-en = "Controller"

[[input.button]]
label = "Cross"
element = "a"

[[input.button]]
label = "Circle"
element = "b"

[[input.button]]
label = "Square"
element = "x"

[[input.button]]
label = "Triangle"
element = "y"

[[input.button]]
label = "Start"
element = "start"

[[input.button]]
label = "Select"
element = "select"

[[input.button]]
label = "L1"
element = "l"

[[input.button]]
label = "R1"
element = "r"

[[input.button]]
label = "L3"
element = "clickl"

[[input.button]]
label = "R3"
element = "clickr"

[[input.directional]]
label = "D-Pad"
directions = 4

[[input.trigger]]
label = "L2"
alignment = "left"

[[input.trigger]]
label = "R2"
alignment = "right"
