[input]
id = "SWITCH_JOYCONS_CONTROLLER"
type = "controller"

[meta]
name = "Joy-Con (L)/(R)"
model-number = ["HAC-015", "HAC-016"]

[[input.button]]
label = "A"
element = "a"

[[input.button]]
label = "B"
element = "b"

[[input.button]]
label = "X"
element = "x"

[[input.button]]
label = "Y"
element = "y"

[[input.button]]
label = "+"
element = "start"

[[input.button]]
label = "-"
element = "select"

[[input.button]]
label = "Home"
element = "guide"

[[input.button]]
label = "Capture"
element = "0"

[[input.button]]
label = "L"
element = "l"

[[input.button]]
label = "R"
element = "r"

[[input.directional]]
label = "D-Pad"
directions = 4

[[input.analog]]
axes = 2
alignment = "left"

[[input.analog]]
axes = 2
alignment = "right"

[[input.analog]]
axes = 3
alignment = "gyroscope"

[[input.analog]]
axes = 3
alignment = "accelerometer"

[[input.trigger]]
label = "ZL"
alignment = "left"
digital = true

[[input.trigger]]
label = "ZR"
alignment = "right"
digital = true

[[input.rumble]]
label = "HD Rumble (Left)"
size = "small"

[[input.rumble]]
label = "HD Rumble (Right)"
size = "small"

[[input.camera]]
label = "IR Camera"
