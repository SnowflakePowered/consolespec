[machine]
name = "Xbox One"
id = "MICROSOFT_XBO"

[meta]
short-name = "XBO"
licensor = "Microsoft"
manufacturer = "Microsoft"
type = "console"

[meta.na]
release-date = "2013-11-22"

[input]
groups = ["controller", "usb"]

[input.controller]
inputs = ["XBOX_CONTROLLER"]
ports = 4

[input.usb]
accessories = true

[accessories]
class = [
    "disney_infinity",
    "skylander",
    "lego_dimensions",
    "guitar",
    "drums",
    "keyboard",
    "mouse",
    "camera",
    "microphone",
    "storage"
]
